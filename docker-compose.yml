# Local stack. Published: web app (3080), Grafana (3300), Jaeger (16686), Prometheus (9090). Everything else is on the
# internal network only, and every internal hop uses mutual TLS with certificates from scripts/dev_certs.py.
#
#   make up                                 # generates dev certificates, then docker compose up --build
#   docker compose --profile private-llm up # also start Ollama as a self-hosted fallback

x-app: &app
  image: uk-banking-agent-platform:local
  pull_policy: never   # built once by the gateway service below
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [internal]
  environment: &env
    BANK_ENVIRONMENT: dev
    BANK_TLS_ENABLED: "true"
    BANK_OIDC_ISSUER: https://demo-idp:8000
    BANK_REDIS_URL: rediss://redis:6379/0
    BANK_REDIS_PASSWORD: ${BANK_REDIS_PASSWORD:-dev-only-redis-password-change-me}
    BANK_CONTEXT_TOKEN_SECRET: ${BANK_CONTEXT_TOKEN_SECRET:-dev-only-change-me-dev-only-change-me}
    BANK_INTERNAL_SERVICE_TOKEN: ${BANK_INTERNAL_SERVICE_TOKEN:-dev-only-change-me-dev-only-change-me}
    BANK_AUDIT_HMAC_KEY: ${BANK_AUDIT_HMAC_KEY:-dev-only-audit-key-change-me-0123456789}
    BANK_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  gateway:
    <<: *app
    build: .
    command: ["python", "-m", "bank_assistant.serve", "gateway"]
    volumes: ["./.dev-certs/gateway:/certs:ro"]
    environment:
      <<: *env
      BANK_AGENT_SERVICE_URL: https://agent:8001
      # Tokens are validated against the demo IdP's JWKS, exactly as against a production IdP.
      BANK_OIDC_JWKS_URL: https://demo-idp:8000/.well-known/jwks.json
    depends_on: [agent, redis, demo-idp]

  # Demo only: issues tokens for the two synthetic customers. Remove for any real deployment.
  demo-idp:
    <<: *app
    command: ["python", "-m", "bank_assistant.serve", "demo-idp"]
    volumes: ["./.dev-certs/demo-idp:/certs:ro"]
    environment: {<<: *env, BANK_DEMO_IDP_ENABLED: "true"}

  web:
    build: ./web
    image: uk-banking-agent-platform-web:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    volumes: ["./.dev-certs/web:/certs:ro"]
    ports: ["${WEB_PORT:-3080}:8080"]
    networks: [internal, edge]
    depends_on: [gateway, demo-idp]

  agent:
    <<: *app
    # Internal network only: the agent's one way out is the egress proxy, which allows the model API and nothing else.
    command: ["python", "-m", "bank_assistant.serve", "agent"]
    volumes: ["./.dev-certs/agent:/certs:ro"]
    environment:
      <<: *env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BANK_LLM_ROUTE: ${BANK_LLM_ROUTE:-anthropic,private,rule_based}
      BANK_PRIVATE_LLM_BASE_URL: ${BANK_PRIVATE_LLM_BASE_URL:-}
      BANK_PRIVATE_LLM_MODEL: ${BANK_PRIVATE_LLM_MODEL:-llama3.1:8b}
      BANK_MCP_ACCOUNTS_URL: https://accounts-mcp:9101/mcp
      BANK_MCP_TRANSACTIONS_URL: https://transactions-mcp:9102/mcp
      BANK_MCP_SERVICE_URL: https://service-mcp:9103/mcp
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: localhost,127.0.0.1,redis,jaeger,gateway,agent,demo-idp,accounts-mcp,transactions-mcp,service-mcp,ollama
    depends_on: [accounts-mcp, transactions-mcp, service-mcp, redis, egress-proxy]

  # Egress allowlist: HTTPS to the hostnames in deploy/egress-proxy/allowed-domains.txt (the model API) only.
  egress-proxy:
    build: ./deploy/egress-proxy
    image: uk-banking-agent-platform-egress:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks: [internal, edge]

  accounts-mcp:
    <<: *app
    command: ["python", "-m", "bank_assistant.serve", "accounts-mcp"]
    volumes: ["./.dev-certs/accounts-mcp:/certs:ro"]
    depends_on: [redis]

  transactions-mcp:
    <<: *app
    command: ["python", "-m", "bank_assistant.serve", "transactions-mcp"]
    volumes: ["./.dev-certs/transactions-mcp:/certs:ro"]
    depends_on: [redis]

  service-mcp:
    <<: *app
    command: ["python", "-m", "bank_assistant.serve", "service-mcp"]
    volumes: ["./.dev-certs/service-mcp:/certs:ro"]
    depends_on: [redis]

  # TLS only (no plain port), clients must present a certificate from the internal CA, and a password is required.
  redis:
    image: redis:7.4-alpine
    user: "999"
    command:
      - sh
      - -c
      - >-
        exec redis-server --port 0 --tls-port 6379
        --tls-cert-file /certs/tls.crt --tls-key-file /certs/tls.key --tls-ca-cert-file /certs/ca.crt
        --tls-auth-clients yes --requirepass "$$REDIS_PASSWORD"
        --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    environment:
      REDIS_PASSWORD: ${BANK_REDIS_PASSWORD:-dev-only-redis-password-change-me}
    volumes: ["./.dev-certs/redis:/certs:ro"]
    read_only: true
    tmpfs: [/data]
    networks: [internal]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]
    networks: [internal, edge]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/helm/uk-banking-agent-platform/files/rules:/etc/prometheus/rules:ro
    ports: ["9090:9090"]
    networks: [internal, edge]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local demo only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bank-assistant.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/helm/uk-banking-agent-platform/files/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3300}:3000"]
    networks: [internal, edge]
    depends_on: [prometheus]

  ollama:
    image: ollama/ollama:0.4.7
    profiles: [private-llm]
    networks: [internal]
    volumes: [ollama:/root/.ollama]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  ollama: {}
