# Local stack. Published: web app (3080), gateway API (8080), Grafana (3300), Jaeger (16686), Prometheus (9090);
# the agent service, MCP servers and Redis are reachable only on the internal network.
#
#   docker compose up --build              # then open http://localhost:3080
#   docker compose --profile private-llm up # also start Ollama as a self-hosted fallback

x-app: &app
  image: uk-banking-agent-platform:local
  pull_policy: never   # built once by the gateway service below
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [internal]
  environment: &env
    BANK_ENVIRONMENT: dev
    BANK_OIDC_ISSUER: http://demo-idp:8000
    BANK_REDIS_URL: redis://redis:6379/0
    BANK_CONTEXT_TOKEN_SECRET: ${BANK_CONTEXT_TOKEN_SECRET:-dev-only-change-me-dev-only-change-me}
    BANK_INTERNAL_SERVICE_TOKEN: ${BANK_INTERNAL_SERVICE_TOKEN:-dev-only-change-me-dev-only-change-me}
    BANK_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317

services:
  gateway:
    <<: *app
    build: .
    command: ["uvicorn", "bank_assistant.gateway.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["${GATEWAY_PORT:-8080}:8000"]
    networks: [internal, edge]
    environment:
      <<: *env
      BANK_AGENT_SERVICE_URL: http://agent:8001
      # Tokens are validated against the demo IdP's JWKS, exactly as against a production IdP.
      BANK_OIDC_JWKS_URL: http://demo-idp:8000/.well-known/jwks.json
    depends_on: [agent, redis, demo-idp]

  # Demo only: issues tokens for the two synthetic customers. Remove for any real deployment.
  demo-idp:
    <<: *app
    command: ["uvicorn", "bank_assistant.demo_idp.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment: {<<: *env, BANK_DEMO_IDP_ENABLED: "true"}

  web:
    build: ./web
    image: uk-banking-agent-platform-web:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports: ["${WEB_PORT:-3080}:8080"]
    networks: [internal, edge]
    depends_on: [gateway, demo-idp]

  agent:
    <<: *app
    # Needs outbound HTTPS to the model API. In production, restrict egress to that host via a proxy.
    networks: [internal, edge]
    command: ["uvicorn", "bank_assistant.services.agent_api:create_app", "--factory", "--host", "0.0.0.0",
              "--port", "8001"]
    environment:
      <<: *env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BANK_LLM_ROUTE: ${BANK_LLM_ROUTE:-anthropic,private,rule_based}
      BANK_PRIVATE_LLM_BASE_URL: ${BANK_PRIVATE_LLM_BASE_URL:-}
      BANK_PRIVATE_LLM_MODEL: ${BANK_PRIVATE_LLM_MODEL:-llama3.1:8b}
      BANK_MCP_ACCOUNTS_URL: http://accounts-mcp:9101/mcp
      BANK_MCP_TRANSACTIONS_URL: http://transactions-mcp:9102/mcp
      BANK_MCP_SERVICE_URL: http://service-mcp:9103/mcp
    depends_on: [accounts-mcp, transactions-mcp, service-mcp, redis]

  accounts-mcp:
    <<: *app
    command: ["python", "-m", "bank_assistant.mcp_servers.accounts_server"]
    environment: {<<: *env, MCP_HOST: 0.0.0.0, MCP_PORT: "9101"}

  transactions-mcp:
    <<: *app
    command: ["python", "-m", "bank_assistant.mcp_servers.transactions_server"]
    environment: {<<: *env, MCP_HOST: 0.0.0.0, MCP_PORT: "9102"}

  service-mcp:
    <<: *app
    command: ["python", "-m", "bank_assistant.mcp_servers.service_server"]
    environment: {<<: *env, MCP_HOST: 0.0.0.0, MCP_PORT: "9103"}

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "volatile-lru"]
    networks: [internal]
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686"]
    networks: [internal, edge]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/helm/uk-banking-agent-platform/files/rules:/etc/prometheus/rules:ro
    ports: ["9090:9090"]
    networks: [internal, edge]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # local demo only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/bank-assistant.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/helm/uk-banking-agent-platform/files/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3300}:3000"]
    networks: [internal, edge]
    depends_on: [prometheus]

  ollama:
    image: ollama/ollama:0.4.7
    profiles: [private-llm]
    networks: [internal]
    volumes: [ollama:/root/.ollama]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  ollama: {}
