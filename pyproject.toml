[project]
name = "uk-banking-agent-platform"
version = "0.1.0"
description = "Reference multi-agent banking assistant for UK retail banking: PII redaction before the LLM, MCP tool servers, customer-confirmed actions, cost and trace per turn."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=1.0",
    "mcp>=2.3",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-sdk>=1.30",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6",
    "redis>=5",
    "structlog>=24",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
e2e = ["pytest-playwright>=0.5"]
dev = ["fakeredis>=2.26", "mypy>=1.11", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "types-PyYAML"]

[project.scripts]
bank-eval = "bank_assistant.evals.run:main"
bank-audit = "bank_assistant.core.audit:main"
bank-serve = "bank_assistant.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S105", "S106", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
"e2e/**" = ["S"]
"scripts/**" = ["S"]
"scripts/gen_*.py" = ["S", "E501"]
"scripts/dev_certs.py" = ["S", "E501"]  # long PromQL and dashboard config strings
"src/bank_assistant/security/redactor.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
