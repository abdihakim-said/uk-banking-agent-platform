name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Also run the eval suite against Claude (uses the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/abdihakim-said/uk-banking-agent-platform
  WEB_IMAGE: ghcr.io/abdihakim-said/uk-banking-agent-platform-web
  EGRESS_IMAGE: ghcr.io/abdihakim-said/uk-banking-agent-platform-egress

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev]"
      - name: Lint and type-check
        run: .venv/bin/ruff check src tests scripts e2e && .venv/bin/mypy src
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: Guardrail evals (offline model; checks routing, confirmations, PII and grounding)
        run: .venv/bin/bank-eval --report eval-report.json
      - name: AI red team (39 attacks; any success fails the build)
        run: .venv/bin/bank-redteam --report redteam-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-report, path: "*-report.json"}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uk-banking-agent-platform:ci .
      - run: docker build -t uk-banking-agent-platform-egress:ci deploy/egress-proxy
      - name: Scan egress proxy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: uk-banking-agent-platform-egress:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: uk-banking-agent-platform:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: browser e2e (full compose stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev,e2e]"
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Start the stack (mTLS everywhere; no API key, so the agent falls back to the offline model)
        run: |
          .venv/bin/python scripts/dev_certs.py
          docker compose up --build -d
          for i in $(seq 1 60); do curl -sf localhost:3080/auth/personas >/dev/null && break; sleep 2; done
      - run: .venv/bin/python -m pytest e2e -q
      - name: Audit chain written during the browser tests verifies
        run: docker compose exec -T gateway bank-audit verify
      - name: Dynamic scan of the running web app (OWASP ZAP baseline)
        run: |
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" zaproxy/zap-stable \
            zap-baseline.py -t http://localhost:3080 -c zap-rules.tsv -I || exit_code=$?
          # -I: warnings don't fail; FAIL-level rules (zap-rules.tsv) do, via exit code 1
          [ "${exit_code:-0}" -ne 1 ]
      - name: Egress allowlist (agent can reach the model API only)
        run: |
          docker compose exec -T agent python -c "
          import httpx, sys
          ok = httpx.get('https://api.anthropic.com/v1/models', timeout=10).status_code
          try:
              httpx.get('https://example.com', timeout=10); sys.exit('example.com was reachable')
          except httpx.HTTPError:
              print('model API', ok, '| example.com blocked')"
      - if: failure()
        run: docker compose ps -a && docker compose logs --tail 80

  security:
    name: security scans (SAST, secrets, dependencies, IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # gitleaks scans the whole history
      - name: Semgrep (SAST)
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config p/python --config p/security-audit --error /src/src
      - name: Gitleaks (secrets in git history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev,e2e]"
      - name: pip-audit (known vulnerabilities in dependencies)
        run: uvx pip-audit --path .venv/lib/python3.12/site-packages --progress-spinner off
      - name: Trivy config (Dockerfiles, compose, Helm chart)
        run: docker run --rm -v "$PWD:/repo" aquasec/trivy:0.57.1 config --severity HIGH,CRITICAL --exit-code 1 /repo

  kubernetes:
    name: helm + kind (NetworkPolicy and e2e on a real cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate the chart (kind, dev, prod values)
        run: |
          C=deploy/helm/uk-banking-agent-platform
          helm lint $C -f $C/values-kind.yaml
          for v in kind dev prod; do
            helm template t $C -f $C/values-$v.yaml | kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
          kubeconform -strict -summary \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/argocd/*.yaml
      - name: Prod guardrails refuse unsafe settings
        run: |
          C=deploy/helm/uk-banking-agent-platform
          ! helm template t $C -f $C/values-prod.yaml --set redis.deploy=true
          ! helm template t $C -f $C/values-prod.yaml --set externalSecrets.enabled=false --set secrets.create=true \
              --set secrets.contextTokenSecret=x --set secrets.internalServiceToken=y
      - name: Prometheus rules (syntax and burn-rate alert unit tests)
        run: |
          docker run --rm -v "$PWD/deploy:/deploy:ro" --entrypoint promtool prom/prometheus:v2.55.1 \
            check rules /deploy/helm/uk-banking-agent-platform/files/rules/slo.yaml /deploy/helm/uk-banking-agent-platform/files/rules/alerts.yaml
          docker run --rm -v "$PWD/deploy:/deploy:ro" -w /deploy/prometheus/tests --entrypoint promtool \
            prom/prometheus:v2.55.1 test rules slo_test.yaml
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: bank-assistant
          config: deploy/kind/cluster.yaml
      - name: Build and load images
        run: |
          docker build -t uk-banking-agent-platform:local .
          docker build -t uk-banking-agent-platform-web:local web
          docker build -t uk-banking-agent-platform-egress:local deploy/egress-proxy
          for img in uk-banking-agent-platform:local uk-banking-agent-platform-web:local uk-banking-agent-platform-egress:local; do
            kind load docker-image $img --name bank-assistant
          done
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev,e2e]"
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Deploy, browser e2e, NetworkPolicy checks
        run: ./deploy/kind/smoke-test.sh
      - if: failure()
        run: |
          kubectl -n bank get pods -o wide
          kubectl -n bank describe pods | tail -80
          kubectl -n bank logs -l app.kubernetes.io/instance=bank --all-containers --tail 40

  publish:
    name: publish images and promote to dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker, e2e, kubernetes, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # commit the new tag to values-dev.yaml
      packages: write     # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build once, tag with the commit
        id: tag
        run: |
          TAG=sha-${GITHUB_SHA::7}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          docker build -t $IMAGE:$TAG -t $IMAGE:main .
          docker build -t $WEB_IMAGE:$TAG -t $WEB_IMAGE:main web
          docker build -t $EGRESS_IMAGE:$TAG -t $EGRESS_IMAGE:main deploy/egress-proxy
          docker push --all-tags $IMAGE
          docker push --all-tags $WEB_IMAGE
          docker push --all-tags $EGRESS_IMAGE
      - name: Promote to dev by Git (Argo CD syncs it)
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          sed -i -E "s/^  tag: \".*\"/  tag: \"$TAG\"/" deploy/helm/uk-banking-agent-platform/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): promote $TAG to dev [skip ci]" && git push || echo "no change"

  live-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.live_eval
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -e ".[dev]"
      - run: .venv/bin/bank-eval --provider anthropic --report eval-report-claude.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-report-claude, path: eval-report-claude.json}
