# Edge for the demo: serves the web app and proxies /api → gateway and /auth → demo IdP on one origin (no CORS).
# Both upstream hops use mutual TLS: nginx verifies the service against the internal CA and presents its own
# certificate (mounted at /certs by docker compose; the Helm chart renders its own copy of this file).
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16k;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        limit_req zone=per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass https://gateway:8000/;
        proxy_read_timeout 120s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
    }

    # Mutual TLS to both upstreams (applies to every proxied location).
    proxy_ssl_certificate /certs/tls.crt;
    proxy_ssl_certificate_key /certs/tls.key;
    proxy_ssl_trusted_certificate /certs/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    # Demo IdP: only the two endpoints the page needs.
    location = /auth/personas { proxy_pass https://demo-idp:8000/personas; }
    location = /auth/token {
        limit_req zone=per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass https://demo-idp:8000/token;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }
}
