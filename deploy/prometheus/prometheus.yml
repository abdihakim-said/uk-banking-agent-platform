global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: ["/etc/prometheus/rules/*.yaml"]   # the same files the Helm chart ships as a PrometheusRule

scrape_configs:
  - job_name: gateway
    static_configs: [{targets: ["gateway:9464"]}]
  - job_name: agent
    static_configs: [{targets: ["agent:9464"]}]
  - job_name: mcp
    static_configs: [{targets: ["accounts-mcp:9464", "transactions-mcp:9464", "service-mcp:9464"]}]
