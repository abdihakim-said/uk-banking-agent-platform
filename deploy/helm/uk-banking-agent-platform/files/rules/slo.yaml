# Generated by scripts/gen_slo_rules.py - edit that, not this file.
groups:
- name: bank-assistant-slo-recording
  interval: 30s
  rules:
  - record: slo:availability_error_ratio:rate5m
    expr: '((sum(rate(gateway_requests_total{outcome=~"agent_unavailable|agent_error"}[5m])) or vector(0))

      + (sum(rate(agent_turns_total{outcome="unavailable"}[5m])) or vector(0)))

      / clamp_min(sum(rate(gateway_requests_total{outcome=~"ok|agent_unavailable|agent_error"}[5m])), 1e-9)'
  - record: slo:latency_slow_ratio:rate5m
    expr: '1 - (sum(rate(gateway_request_duration_seconds_bucket{le="15.0"}[5m]))

      / clamp_min(sum(rate(gateway_request_duration_seconds_count[5m])), 1e-9))'
  - record: slo:availability_error_ratio:rate30m
    expr: '((sum(rate(gateway_requests_total{outcome=~"agent_unavailable|agent_error"}[30m])) or vector(0))

      + (sum(rate(agent_turns_total{outcome="unavailable"}[30m])) or vector(0)))

