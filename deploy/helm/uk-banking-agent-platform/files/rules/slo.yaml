- name: bank-assistant-slo-alerts
  rules:
  - alert: SLOAvailabilityBurnRate1h
    expr: 'slo:availability_error_ratio:rate1h > (14.4 * 0.005)

      and slo:availability_error_ratio:rate5m > (14.4 * 0.005)'
    labels:
      severity: page
      slo: availability
    annotations:
      summary: 'Availability SLO burning fast: 2% of the 30-day budget in 1 hour'
      description: 'SLO: 99.5% of chat turns get a real answer (not an error or ''assistant unavailable''). Burn rate over
        1h and 5m is above 14.4x.'
  - alert: SLOAvailabilityBurnRate6h
    expr: 'slo:availability_error_ratio:rate6h > (6 * 0.005)

      and slo:availability_error_ratio:rate30m > (6 * 0.005)'
    labels:
      severity: page
      slo: availability
    annotations:
      summary: 'Availability SLO burning fast: 5% of the 30-day budget in 6 hours'
      description: 'SLO: 99.5% of chat turns get a real answer (not an error or ''assistant unavailable''). Burn rate over
        6h and 30m is above 6x.'
  - alert: SLOAvailabilityBurnRate1d
    expr: 'slo:availability_error_ratio:rate1d > (3 * 0.005)

      and slo:availability_error_ratio:rate2h > (3 * 0.005)'
    labels:
      severity: ticket
      slo: availability
    annotations:
      summary: 'Availability SLO burning fast: 10% of the 30-day budget in 1 day'
      description: 'SLO: 99.5% of chat turns get a real answer (not an error or ''assistant unavailable''). Burn rate over
        1d and 2h is above 3x.'
  - alert: SLOAvailabilityBurnRate3d
    expr: 'slo:availability_error_ratio:rate3d > (1 * 0.005)

      and slo:availability_error_ratio:rate6h > (1 * 0.005)'
    labels:
      severity: ticket
      slo: availability
    annotations:
      summary: 'Availability SLO burning fast: 10% of the 30-day budget in 3 days'
      description: 'SLO: 99.5% of chat turns get a real answer (not an error or ''assistant unavailable''). Burn rate over
        3d and 6h is above 1x.'
  - alert: SLOLatencyBurnRate1h
    expr: 'slo:latency_slow_ratio:rate1h > (14.4 * 0.05)

      and slo:latency_slow_ratio:rate5m > (14.4 * 0.05)'
    labels:
      severity: page
      slo: latency
    annotations:
      summary: 'Latency SLO burning fast: 2% of the 30-day budget in 1 hour'
      description: 'SLO: 95% of successful chat turns complete within 15 seconds. Burn rate over 1h and 5m is above 14.4x.'
  - alert: SLOLatencyBurnRate6h
    expr: 'slo:latency_slow_ratio:rate6h > (6 * 0.05)

      and slo:latency_slow_ratio:rate30m > (6 * 0.05)'
    labels:
      severity: page
      slo: latency
    annotations:
      summary: 'Latency SLO burning fast: 5% of the 30-day budget in 6 hours'
      description: 'SLO: 95% of successful chat turns complete within 15 seconds. Burn rate over 6h and 30m is above 6x.'
  - alert: SLOLatencyBurnRate1d
    expr: 'slo:latency_slow_ratio:rate1d > (3 * 0.05)

      and slo:latency_slow_ratio:rate2h > (3 * 0.05)'
    labels:
      severity: ticket
      slo: latency
    annotations:
      summary: 'Latency SLO burning fast: 10% of the 30-day budget in 1 day'
      description: 'SLO: 95% of successful chat turns complete within 15 seconds. Burn rate over 1d and 2h is above 3x.'
  - alert: SLOLatencyBurnRate3d
    expr: 'slo:latency_slow_ratio:rate3d > (1 * 0.05)

      and slo:latency_slow_ratio:rate6h > (1 * 0.05)'
    labels:
      severity: ticket
      slo: latency
    annotations:
      summary: 'Latency SLO burning fast: 10% of the 30-day budget in 3 days'
      description: 'SLO: 95% of successful chat turns complete within 15 seconds. Burn rate over 3d and 6h is above 1x.'
