# Generated by scripts/gen_slo_rules.py - edit that, not this file.
groups:
- name: bank-assistant-operational
  rules:
  - alert: ServiceDown
    expr: up{job=~".*(gateway|agent|mcp).*"} == 0
    for: 2m
    labels:
      severity: page
    annotations:
      summary: '{{ $labels.job }} {{ $labels.instance }} is down or unreachable'
  - alert: LLMFallbackActive
    expr: sum(rate(llm_fallbacks_total[5m])) > 0
    for: 5m
    labels:
      severity: ticket
    annotations:
      summary: Turns are being served by a fallback LLM provider
  - alert: GuardrailReplacingReplies
    expr: sum(rate(guardrail_events_total{guard="groundedness"}[15m])) > 0.05
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: The output guard is replacing ungrounded replies; check the model and prompts
  - alert: LLMSpendHigh
    expr: sum(increase(llm_cost_usd_total[1h])) > 20
    labels:
      severity: ticket
    annotations:
      summary: LLM spend above $20 in the last hour
  - alert: ToolErrorsHigh
    expr: 'sum(rate(mcp_tool_calls_total{outcome="error"}[5m]))

      / clamp_min(sum(rate(mcp_tool_calls_total[5m])), 1e-9) > 0.2'
    for: 10m
    labels:
      severity: page
    annotations:
      summary: More than 20% of MCP tool calls are failing
