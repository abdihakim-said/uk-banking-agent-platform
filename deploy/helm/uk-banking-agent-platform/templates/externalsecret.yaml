{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bank.secretName" . }}
  labels: {{- include "bank.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ required "externalSecrets.secretStoreRef.name" .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ include "bank.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: BANK_CONTEXT_TOKEN_SECRET
      remoteRef: {key: {{ .Values.externalSecrets.remoteKeys.contextTokenSecret }}}
    - secretKey: BANK_INTERNAL_SERVICE_TOKEN
      remoteRef: {key: {{ .Values.externalSecrets.remoteKeys.internalServiceToken }}}
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: {key: {{ .Values.externalSecrets.remoteKeys.anthropicApiKey }}}
{{- end }}
