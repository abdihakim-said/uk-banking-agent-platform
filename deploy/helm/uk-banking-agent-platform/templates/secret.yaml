{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) (not .Values.externalSecrets.enabled) }}
{{- if eq .Values.environment "prod" }}
{{- fail "secrets.create is for local clusters; use externalSecrets or secrets.existingSecret in prod" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bank.secretName" . }}
  labels: {{- include "bank.labels" . | nindent 4 }}
type: Opaque
stringData:
  BANK_CONTEXT_TOKEN_SECRET: {{ required "secrets.contextTokenSecret" .Values.secrets.contextTokenSecret | quote }}
  BANK_INTERNAL_SERVICE_TOKEN: {{ required "secrets.internalServiceToken" .Values.secrets.internalServiceToken | quote }}
  BANK_REDIS_PASSWORD: {{ required "secrets.redisPassword" .Values.secrets.redisPassword | quote }}
  BANK_AUDIT_HMAC_KEY: {{ required "secrets.auditHmacKey" .Values.secrets.auditHmacKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
{{- end }}
