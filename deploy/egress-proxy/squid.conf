# Egress allowlist: the only way out of the cluster for the agent. HTTPS (CONNECT) to listed hostnames only.
http_port 3128
pid_filename none   # foreground process; a PID file left on a pod volume would block restarts
coredump_dir /tmp
cache deny all
# Sized for a pod with a 128 MiB limit. Squid otherwise sizes tables for every available file descriptor (over a
# million in containers) and a 256 MB memory cache, and gets OOM-killed.
cache_mem 8 MB
max_filedescriptors 4096
memory_pools off
cache_log stdio:/dev/stderr
access_log stdio:/dev/stdout squid
logfile_rotate 0
via off
forwarded_for delete

acl allowed_domains dstdomain "/etc/squid/allowlist/allowed-domains.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !SSL_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_domains
http_access deny all
