groups:
  - name: bank-assistant
    rules:
      - alert: LLMFallbackActive
        expr: sum(rate(llm_fallbacks_total[5m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Turns are being served by a fallback LLM provider"}
      - alert: GuardrailReplacingReplies
        expr: sum(rate(guardrail_events_total{guard="groundedness"}[15m])) > 0.05
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "The output guard is replacing ungrounded replies; check the model and prompts"}
      - alert: LLMSpendHigh
        expr: sum(increase(llm_cost_usd_total[1h])) > 20
        labels: {severity: warning}
        annotations: {summary: "LLM spend above $20 in the last hour"}
      - alert: ToolErrorsHigh
        expr: sum(rate(mcp_tool_calls_total{outcome="error"}[5m])) / sum(rate(mcp_tool_calls_total[5m])) > 0.2
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "More than 20% of MCP tool calls are failing"}
